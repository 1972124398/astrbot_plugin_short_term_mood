name: Test

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_short_term_mood
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
        working-directory: astrbot_plugin_short_term_mood

  sdk:
    runs-on: ubuntu-latest
    env:
      ASTRBOT_ROOT: ${{ runner.temp }}/astrbot-test-runtime
    steps:
      - uses: actions/checkout@v4
        with:
          path: astrbot_plugin_short_term_mood
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "astrbot==4.29.4"
      - run: python -m unittest discover -s tests -v
        working-directory: astrbot_plugin_short_term_mood
